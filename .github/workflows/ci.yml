name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Regression tests
        run: bun test framework/tests

      - name: Root check
        run: bun run check

      - name: Root doctor
        run: bun run doctor

      - name: Starter template check
        working-directory: templates/default
        run: bun ../../framework/cli/sttc.ts check

      - name: Create smoke
        run: bun run smoke:create
