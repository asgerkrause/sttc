<section>
  <div class="c">
    <div class="w">
      <h1>Component showcase</h1>
      <p class="f-md">Copy-ready examples for every built-in component. Compose primitives inside routes and adjust content.</p>
    </div>
    <div class="btns">
      <Button label="Back home" href="/" />
      <Button label="Read docs" href="https://github.com/sanitizestudio/snz-bp" color="tone" />
    </div>
  </div>
</section>

<Section id="buttons">
  <h2>Button + Link</h2>
  <div class="btns">
    {#each buttons as button}
    <Button label="{{button.label}}" href="#" color="{{button.color}}" />
    {/each}
  </div>

  <div class="btns">
    {#each buttons as button}
    <Button label="{{button.label}}" href="#" color="{{button.color}}" icon="→" />
    {/each}
  </div>

  <div class="btns">
    {#each buttons as button}
    <Button label="{{button.label}}" href="#" color="{{button.color}}" image="{{button.image}}" />
    {/each}
  </div>

  <p><Link label="Inline link" href="/" /></p>
</Section>

<Section id="cards">
  <h2>Card</h2>
  <Grid cols="4-2">
    {#each cards as card}
    <Card variant="{{card.variant}}" theme="{{card.theme}}">
      <h3>{{card.title}}</h3>
      <p>{{card.body}}</p>
    </Card>
    {/each}
  </Grid>
</Section>

<Section id="forms">
  <h2>Forms</h2>
  <Form action="#" method="post">
    <div g="2">
      <Input name="name" label="Full Name" required autocomplete="name" placeholder="Jane Doe" />
      <Input name="company" label="Company Name" required autocomplete="organization" placeholder="Acme Corp" />
    </div>
    <div g="2">
      <Input type="email" name="email" label="Work Email" required autocomplete="email" placeholder="jane@acmecorp.com" />
      <Input type="tel" name="phone" label="Phone Number" required autocomplete="tel" inputmode="tel" placeholder="+1 (555) 000-0000" />
    </div>
    <Fieldset legend="Company Size" required>
      <Radio name="size" value="1-10" label="1-10" required />
      <Radio name="size" value="11-50" label="11-50" />
      <Radio name="size" value="50+" label="50+" />
    </Fieldset>
    <Fieldset legend="Services Required" required>
      <Checkbox name="services" value="design" label="Design System" />
      <Checkbox name="services" value="dev" label="Web Development" />
      <Checkbox name="services" value="brand" label="Brand Strategy" />
    </Fieldset>
    <Textarea name="message" label="Project Notes" required rows="4" placeholder="Tell us what you need." />
    <Submit label="Submit Inquiry" color="accent" />
    <FormStatus>Native browser validation handles required fields before submit.</FormStatus>
  </Form>
</Section>

<Section id="editorial" theme="tone">
  <h2>Statement + Split</h2>
  <Statement variant="accent">Static sites should feel sharp, fast, and easy to reshape.</Statement>
  <p class="f-lg"><Split>Split wraps words for animation-ready text while preserving an accessible label.</Split></p>
  <Grid cols="2">
    <div class="w">
      <h3>Layout still uses Grid</h3>
      <p>Use layout primitives for two-column content. Use <code>Split</code> for text splitting.</p>
      <Button label="Primary action" href="/components/" color="accent" />
    </div>
    <Image src="r1" alt="Abstract component media example" max="1200" />
  </Grid>
</Section>

<Section id="badges-icons">
  <h2>Badge + Icon + Socials</h2>
  <div class="btns">
    <Badge>Default</Badge>
    <Badge variant="tone">Tone</Badge>
    <Badge variant="accent">Accent</Badge>
    <Badge variant="secondary">Secondary</Badge>
  </div>

    <Icon label="Decorative dot" />

<Section id="markdown">
  <h2>Markdown</h2>
  <Markdown>
## Markdown should feel like authored content

Use markdown for prose-heavy pages: notes, case studies, docs, changelogs, and CMS posts. It renders at build time, so output stays static and readable.

| Feature | Why it matters |
| --- | --- |
| Tables | Compare facts without custom components. |
| Code fences | Document HTML, CSS, and shell snippets. |
| Component passthrough | Keep long-form content close to site primitives. |

- Write natural paragraphs first.
- Use headings to create page rhythm.
- Add code examples where authors need exact syntax.
  </Markdown>
</Section>

<Section id="themes" theme="tone">
  <h2>Section themes</h2>
  <Grid cols="3-2">
    <Card><h3>Tone</h3><p><code>Section theme="tone"</code> remaps semantic tokens.</p></Card>
    <Card theme="tone"><h3>Tone card</h3><p><code>Card theme="tone"</code> uses the same data-theme contract.</p></Card>
    <Card theme="invert"><h3>Invert card</h3><p>Theme attrs compose with card variants.</p></Card>
  </Grid>
</Section>

<Section id="layout">
  <h2>Section, Grid, Stack</h2>
  <Grid cols="3-2">
    <Stack><h3>Stack</h3><p>Legacy wrapper for vertical rhythm. Prefer <code>.w</code> directly in new work.</p></Stack>
    <div class="w"><h3>Grid child</h3><p>Grid maps to global <code>[g]</code> primitives and can be used inside components.</p></div>
    <div class="w"><h3>Section</h3><p>Section owns the semantic band, container, and optional theme.</p></div>
  </Grid>
</Section>

<Section id="shell">

    <Card>
      <Logo />

    <Card>
      <h3>Header + Footer</h3>
      <p>Shell components usually live in <code>src/shell.html</code>, not inside route bodies.</p>
    </Card>
  </Grid>
</Section>
