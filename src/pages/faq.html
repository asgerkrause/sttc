<script type="application/json" data-snz src="faq.json"></script>

<head>
  <SEO
    title="Frequently asked questions"
    description="Answers about STTC, static output, JavaScript requirements, and generated discovery metadata." />
</head>

<Section id="faq" label="Frequently asked questions">
  <h1>Frequently asked questions</h1>
  <section itemscope itemtype="https://schema.org/FAQPage">
    {#each items as item}
    <details name="faq" itemprop="mainEntity" itemscope itemtype="https://schema.org/Question">
      <summary itemprop="name">{{item.summary}}</summary>
      <div itemprop="acceptedAnswer" itemscope itemtype="https://schema.org/Answer">
        <p itemprop="text">{{item.body}}</p>
      </div>
    </details>
    {/each}
  </section>
</Section>
