<!--
  @desc Large editorial statement block.
  @attr variant=[default|accent|quiet] :class Visual tone.
  @attr theme=[tone|accent|invert] Optional data-theme value.
-->
<blockquote class="statement" data-theme="{{theme}}">
  {{slot}}
</blockquote>

<style>
  .statement {
    max-width: 18ch;
    margin: 0;
    color: var(--i);
    font-size: var(--h1-fs);
    font-weight: var(--fw-l);
    letter-spacing: var(--h1-ls);
    line-height: var(--h1-lh);
    text-wrap: balance;
  }

  .statement.accent {
    color: var(--a);
  }

  .statement.quiet {
    color: var(--g);
  }

  .statement[data-theme] {
    background: var(--s);
    color: var(--i);
    border-radius: var(--br);
    padding: var(--pd-lg);
  }
</style>
