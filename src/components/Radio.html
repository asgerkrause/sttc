<!--
  @desc Labeled native radio option.
  @attr name! Radio group name.
  @attr label! Visible label.
  @attr value! Radio value.
  @attr required Adds native required validation.
  @attr checked Initial checked state.
  @attr disabled Disables the radio.
-->
<label>
  <input type="radio" name="{{name}}" value="{{value}}" {#if required}required{/if} {#if checked}checked{/if} {#if disabled}disabled{/if}>
  <span>{{label}}</span>
</label>
