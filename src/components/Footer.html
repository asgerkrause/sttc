<!--
  @desc Semantic site footer with identity and a current-year fallback rendered at build time.
  @attr siteName Optional site-name override.
-->
<footer>
  <div c>
    <div>
      <span>{{siteName}}</span>
      <span>&copy;</span>
      <span data-snz-year> </span>
    </div>
  </div>
</footer>

<script>
  const year = el.querySelector('[data-snz-year]')
  if (year) year.textContent = String(new Date().getFullYear())
</script>
