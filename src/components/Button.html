<!--
  @desc Link styled as an action button.
  @attr href Destination URL or path. Defaults to #.
  @attr label Visible button text. Defaults to Learn more.
  @attr color=[default|ghost|tone|accent|accent tone|complimentary|complimentary tone] :class Visual color treatment.
  @attr size=[sm|md|lg] :class Size variant.
  @attr icon Optional decorative literal icon/glyph. Provider syntax like lucide:arrow-right is reserved.
  @attr image Optional decorative local image name from src/images, without extension.
  @attr track Optional analytics event name; emits data-snz-track on the root.
-->
<a class="btn" href="{{href}}" aria-label="{{label}}">
  {#if slot:vis}
  <span class="btn-vis-w" aria-hidden="true">{{slot:vis}}</span>
  {/if}
  {#if image}
  <span class="btn-vis-w" aria-hidden="true"><img src="/assets/images/{{image}}-320.webp" alt="" loading="lazy" decoding="async"></span>
  {/if}
  {#if icon}
  <span class="btn-vis-w" aria-hidden="true"><span>{{icon}}</span><span>{{icon}}</span></span>
  {/if}
  <span class="btn-txt-w" aria-hidden="true">
    <span>{{label}}</span>
    <span>{{label}}</span>
  </span>
</a>

<style>
  .btn {
    --btn-s: var(--i90);
    --btn-i: var(--s);
    --btn-b: transparent;
    --btn-vis-s: color-mix(in srgb, var(--btn-i) 15%, var(--btn-s));
    --btn-vis-i: color-mix(in srgb, var(--btn-i) 80%, var(--btn-s));
    --btn-vis-h: 2.5lh;
    border: var(--bw) var(--btn-b) solid;
    background: var(--btn-s);
    color: var(--btn-i);
    display: inline-flex;
    cursor: pointer;
    padding: var(--pd-sm) var(--pd);
    text-decoration: none;
    border-radius: var(--br);


    &.ghost {
      --btn-s: transparent;
      --btn-i: var(--g);
      --btn-b: transparent;
    }

    &.tone {
      --btn-s: var(--t);
      --btn-i: var(--n80);
      --btn-b: var(--b);
    }

    &.accent {
      --btn-s: var(--a);
      --btn-i: var(--ai);

      &.tone {
        --btn-s: var(--a05);
        --btn-i: var(--a60);
        --btn-b: var(--a10);
      }
    }

    &.complimentary {
      --btn-s: var(--c);
      --btn-i: var(--ci);

      &.tone {
        --btn-s: var(--c05);
        --btn-i: var(--c60);
        --btn-b: var(--c10);
      }
    }

    &:is(:hover, :focus-visible) {
      --btn-s: var(--n100);
      --btn-i: var(--n00);


      &.ghost {
        --btn-s: var(--t);
        --btn-i: var(--i);
        --btn-b: transparent;
      }

      &.tone {
        --btn-s: var(--a05);
        --btn-i: var(--a80);
        --btn-b: var(--a10);
      }

      &.accent,
      &.complimentary {
        --btn-s: var(--i);
        --btn-i: var(--s);

        &.tone {
          --btn-s: var(--t);
          --btn-i: var(--n80);
          --btn-b: var(--b);
        }
      }
    }

    &:active {
      transform: scale(0.96);
    }

    &.sm {
      --btn-vis-h: 2.5em;
      padding: var(--pd-xs) var(--pd-sm);
      border-radius: var(--br-sm);
      font-size: var(--sm-fs);

      &:has(.btn-vis-w) {
        padding: var(--btn-pd) var(--pd-sm) var(--btn-pd) var(--btn-pd);
      }
    }

    &.lg {
      --btn-vis-h: 4em;
      padding: var(--pd) var(--pd-lg);
      border-radius: var(--br-lg);
      font-size: var(--lg-fs);

      &:has(.btn-vis-w) {
        padding: var(--btn-pd) var(--pd-lg) var(--btn-pd) var(--btn-pd);
      }
    }

    /* with visual content */
    &:has(.btn-vis-w) {
      --btn-pd: .2em;
      align-items: center;
      gap: var(--gp);
      padding: var(--btn-pd) var(--pd) var(--btn-pd) var(--btn-pd);

    }

    .btn-vis-w,
    .btn-txt-w {
      overflow: hidden;
    }

    .btn-vis-w {
      flex: none;
      border-radius: calc(var(--br) - var(--btn-pd));

      &:has(:is(span, i, b, svg)) {
        display: inline-flex;
        width: var(--btn-vis-h);
        height: var(--btn-vis-h);
        align-items: center;
        justify-content: flex-end;
        background: var(--btn-vis-s);
        color: var(--btn-vis-i);
        transition-property: background, color;
        transition-duration: var(--td);
        transition-timing-function: var(--tf-o);
      }

      &:has(:is(img, picture)) {
        height: var(--btn-vis-h);
      }

      :is(span, i, b, svg) {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 100%;
        height: 100%;
        transform: translateX(calc(100% * var(--is-t)));
        transition-property: transform, color;
        transition-duration: var(--td-s);
        transition-timing-function: var(--tf-s);
      }

      :is(img, picture) {
        display: block;
        height: 100%;
        width: auto;
        transform: scale(calc(1 + .2 * var(--is-f)));
        transition-property: transform;
        transition-duration: var(--td-f);
        transition-timing-function: var(--tf-o);
      }

      img {
        height: 100%;
        width: auto;
        object-fit: cover;
      }
    }

    .btn-txt-w {
      height: 1lh;

      span {
        display: block;
        transform: translateY(calc(var(--is-t) * -100%));
        transition-property: transform, color;
        transition-duration: var(--td-s);
        transition-timing-function: var(--tf-s);
      }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn {
      .btn-vis-w :is(span, i, b, svg),
      .btn-vis-w :is(img, picture),
      .btn-txt-w span {
        transform: none;
        transition: none;
      }
    }
  }
</style>
