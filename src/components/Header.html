<!--
  @desc Site header.
-->
<header>
  <div class="c">
    <Logo size="1lh" />
    <button
      type="button"
      class="brg"
      aria-expanded="false"
      aria-controls="primary-nav"
      aria-label="Menu"
    ></button>
    <nav id="primary-nav" aria-label="Primary">
      <ul>
        <li><a class="lnk" href="/">Home</a></li>
        <li><a class="lnk" href="/components/">Components</a></li>
        <li><a class="lnk" href="/about/">About</a></li>
        <li><a class="lnk" href="/contact/">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<style>
  body>header {
  --hdr-h: 4rem;
  --hdr-fade: 1px;
  --hdr-bg: var(--s);
  --hdr-fg: var(--i);
  --hdr-b: var(--b);
  --hdr-hero-bg: var(--s10);
  --hdr-hero-fg: var(--i);
  --hdr-hero-b: var(--b);

  background: var(--hdr-bg);
  color: var(--hdr-fg);
  view-transition-name: header;
  backdrop-filter: blur(2rem);
  border-bottom: var(--bw) var(--b) solid;
  min-height: var(--hdr-h);
  padding: 0 var(--px);
  position: fixed;
  inset: 0;
  bottom: auto;
  z-index: 1000;
  display: flex;

  .c {
    flex-direction: row;
    align-items: center;
    justify-content: center;
  }

  nav ul {
    display: flex;
    flex-direction: row;
    list-style: none;
    align-items: center;
    padding: 0;
    margin: 0;
    gap: var(--gp);
  }

  .brg {
    position: relative;
    background: var(--i05);
    color: var(--i);
    z-index: 1000;
    width: 4em;
    height: 2em;
    margin-left: auto;
    border: none;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    border-radius: 100vw;
    display: flex;
    flex-direction: column;


    &::before,
    &::after {
      content: "";
      width: 33%;
      height: var(--bw);
      background: currentColor;
      position: absolute;
      border-radius: 100vw;
      transition-property: color, background, transform;
      transition-timing-function: var(--tf-s);
      transition-duration: var(--td-s);
    }

    &::after {
      transform: translateY(-0.2em);
    }

    &::before {
      transform: translateY(0.2em);
    }

    &:hover {
      background: var(--n10);
    }

    &[aria-expanded="true"] {
      background: var(--i10);

      &::after {
        transform: rotate(45deg);
      }

      &::before {
        transform: rotate(135deg);
      }
    }
  }

  @media (width > 60rem) {
    .brg {
      display: none !important;
    }

    nav {
      display: flex;
      margin-left: auto;
    }
  }

  @media (width <=60rem) {
    nav {
      display: none;
      position: fixed;
      inset: 0;
    }

    &:has([aria-expanded="true"]) nav {
      display: flex;
      position: fixed;
      inset: 0;
      height: 100vh;
      width: 100vw;
      padding: var(--px);
      align-items: end;

      ul {
        flex-direction: column;
        gap: 0;
        width: 100%;

        a {
          font-size: var(--h2-fs);
        }
      }
    }
  }
}

@supports (animation-timeline: view()) {
  @keyframes snz-hdr-hero {
    from {
      --hdr-bg: var(--hdr-hero-bg);
      --hdr-fg: var(--hdr-hero-fg);
      --hdr-b: var(--hdr-hero-b);
    }

    to {
      --hdr-bg: var(--s);
      --hdr-fg: var(--i);
      --hdr-b: var(--b);
    }
  }

  body>header {
    animation-name: snz-hdr-hero;
    animation-timeline: --snz-hero;
    animation-range:
      exit calc(100% - var(--hdr-h) - var(--hdr-fade))
      exit calc(100% - var(--hdr-h));
    animation-fill-mode: both;
    animation-timing-function: steps(1, end);
  }
}

@media (width <=60rem) {
  body:has(header [aria-expanded="true"]) :is(main, footer) {
    pointer-events: none;
    user-select: none;
  }

  body:has(header [aria-expanded="true"]) main::after {
    content: "";
    background: color-mix(in srgb, var(--s) 90%, transparent);
    position: fixed;
    inset: 0;
    z-index: 998;
    backdrop-filter: blur(10px);
    pointer-events: none;
  }
}
</style>
