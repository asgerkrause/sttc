-->

<style>
  .md {

    h2, h3, h4 { text-wrap: balance; margin-top: 1.5em; margin-bottom: .5em; }

    a { color: inherit; text-decoration: underline; text-underline-offset: .2em; }
    blockquote { margin: 0 0 1em; padding-left: 1em; border-left: 2px solid currentColor; opacity: .8; }
  }
</style>
