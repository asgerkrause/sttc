<!--
  @desc Responsive Craft grid that preserves source order.
  @attr cols Optional column count mapped to the Craft g attribute. Omit for Craft's default grid.
  @attr x Item column span mapped to the Craft c attribute when Grid is nested.
  @attr y Item row span mapped to the Craft r attribute when Grid is nested.
  @attr order Responsive order mapped to the Craft o attribute when Grid is nested.
-->
{#if cols}<div g="{{cols}}" c="{{x}}" r="{{y}}" o="{{order}}">{{slot}}</div>{:else}<div g c="{{x}}" r="{{y}}" o="{{order}}">{{slot}}</div>{/if}
