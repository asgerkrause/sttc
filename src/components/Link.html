<!--
  @desc Underlined inline link.
  @attr href Destination URL or path. Defaults to #.
  @attr label Link text. Defaults to Learn more.
-->
<a class="link" href="{{href}}">{{label}}</a>

<style>
  a.link {
    background-image: linear-gradient(0deg, var(--c-ink), var(--c-ink));
    background-repeat: no-repeat;
    background-position-x: right;
    background-position-y: 100%;
    background-size: 0 var(--s-bw);

    @media (hover: hover) {
      &:hover {
        background-size: 100% var(--s-bw);
        background-position-x: left;
      }

      &:not(:hover, :focus-visible) {
        color: var(--c-mut);
      }
    }

    @media (hover: none) {
      background-size: 100% var(--s-bw);
    }

    &:focus-visible {
      background-size: 100% var(--s-bw);
      background-position-x: left;
    }

    &[aria-current="page"] {
      background-size: 100% var(--s-bw);
      color: var(--c-ink);
    }
  }
</style>
