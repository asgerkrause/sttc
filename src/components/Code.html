<!--
  @desc Code block with optional language label. Put the code in the default slot.
  @attr lang Language identifier (e.g. js, ts, html, css).
-->
<figure class="code">
  {#if lang}
  <figcaption class="code-lb">{{lang}}</figcaption>
  {/if}
  <pre><code class="lang-{{lang}}">{{slot}}</code></pre>
</figure>

<style>
  .code {
    border: var(--bw) solid var(--b);
    border-radius: var(--br);
    overflow: hidden;
    background: var(--t);

    .code-lb {
      padding: var(--pd-xs) var(--pd-sm);
      color: var(--g);
      font-size: var(--sm-fs);
      font-weight: var(--fw-b);
      letter-spacing: var(--sm-ls);
      line-height: var(--sm-lh);
      text-transform: uppercase;
      border-bottom: var(--bw) solid var(--b);
    }
    pre {
      margin: 0;
      padding: var(--pd);
      overflow-x: auto;
      font-family: var(--ff-mono);
      font-size: var(--sm-fs);
      line-height: var(--sm-lh);
    }
    code { font-family: inherit; }
  }
</style>
