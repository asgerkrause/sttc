<!--
  @desc Code block with optional language label. Put the code in the default slot.
  @attr lang Language identifier (e.g. js, ts, html, css).
-->
<figure class="code">
  {#if lang}
  <figcaption class="code-lb">{{lang}}</figcaption>
  {/if}
  <pre><code class="lang-{{lang}}">{{slot}}</code></pre>
</figure>

<style>
  .code {
    border: var(--s-bw) solid var(--c-bor);
    border-radius: var(--s-br);
    overflow: hidden;
    background: var(--c-sur);

    .code-lb {
      padding: var(--s-pd-xs) var(--s-pd-sm);
      color: var(--c-mut);
      font-size: var(--t-sm-fs);
      font-weight: var(--t-fw-b);
      letter-spacing: var(--t-sm-ls);
      line-height: var(--t-sm-lh);
      text-transform: uppercase;
      border-bottom: var(--s-bw) solid var(--c-bor);
    }
    pre {
      margin: 0;
      padding: var(--s-pd);
      overflow-x: auto;
      font-family: var(--t-ff-mo);
      font-size: var(--t-sm-fs);
      line-height: var(--t-sm-lh);
    }
    code { font-family: inherit; }
  }
</style>
