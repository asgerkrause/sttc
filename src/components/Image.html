<!--
  @desc Responsive WebP image. Lazy by default with temporary .img-tmp preview; eager images skip preview. Master in an image source root; build emits optimized /assets/images/{src}.webp variants.
  @attr src! Unique logical image name (basename without extension).
  @attr alt! Alt text. Use alt="" for decorative.
  @attr max Max long edge in px. Default 1200.
  @attr quality WebP quality 1-100. Default 82.
  @attr loading=[lazy|eager] Default lazy. Use eager for above-fold.
  @attr sizes CSS sizes attribute. Default 100vw when responsive.
  @attr responsive=[true|false] Set false to opt out of srcset emission. Default true.
  @attr width Override intrinsic width.
  @attr height Override intrinsic height.
-->
<div data-scrub class="img-w" style="aspect-ratio: {{aspectWidth}} / {{aspectHeight}}">
  {{imgTmp}}
  {{imgMain}}
</div>

<style>
  .img-w {
    overflow: hidden;
    position: relative;
    width: 100%;
    border-radius: var(--br);
    background-image: linear-gradient(35deg, var(--b), var(--t));
  }

  .img-w img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .img-w .img-tmp {
    position: absolute;
    inset: 0;
    z-index: 1;
    image-rendering: pixelated;
  }

  @supports (animation-timeline: view()) {
    .img-w[data-scrub] {
      --plx: 8vh;
      transition-timing-function: linear;
    }

    .img-w[data-scrub] img {
      height: calc(100% + var(--plx));
      margin-top: calc(var(--plx) * -1);
      transform: translateY(calc(var(--plx) * var(--sp-t)));
    }

    .img-w[data-scrub] .img-tmp {
      position: absolute;
      inset: 0;
    }
  }
</style>
