<!--
  @desc Small inline label.
  @attr variant=[default|tone|accent|secondary] :class Visual style.
-->
<span class="bdg">{{slot}}</span>

<style>
  .bdg {
    align-items: center;
    align-self: start;
    background: var(--e-bdg-sur);
    border: var(--b-wd) solid var(--e-bdg-bor);
    border-radius: var(--r-sm);
    color: var(--e-bdg-ink);
    display: inline-flex;
    font-size: var(--t-sm-fs);
    font-weight: var(--t-fw-bd);
    gap: var(--p-xs);
    line-height: 1;
    padding: var(--p-xs) var(--p-sm);
    white-space: nowrap;


    &.tone {
      --e-bdg-sur: var(--c-sf);
      --e-bdg-ink: var(--c-fg);
    }

    &.accent {
      --e-bdg-sur: var(--c-ac);
      --e-bdg-ink: var(--c-ac-co);
      --e-bdg-bor: var(--c-ac);
    }

    &.secondary {
      --e-bdg-sur: var(--c-sc);
      --e-bdg-ink: var(--c-sc-co);
      --e-bdg-bor: var(--c-sc);
    }
  }
</style>
