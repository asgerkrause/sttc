<!--
  @desc Link styled as an action button.
  @attr href Destination URL or path. Defaults to #.
  @attr label Visible button text. Defaults to Learn more.
  @attr variant=[default|ghost|tone|accent|accent tone|secondary|secondary tone] :class Visual variant.
  @attr size=[sm|md|lg] :class Size variant.
  @attr icon Optional decorative literal icon/glyph. Provider syntax like lucide:arrow-right is reserved.
  @attr image Optional decorative local image name from src/images, without extension.
  @attr track Optional analytics event name; emits data-snz-track on the root.
-->
<a class="btn" href="{{href}}" aria-label="{{label}}">
  {#if slot:vis}
  <span class="btn-vis-w" aria-hidden="true">{{slot:vis}}</span>
  {/if}
  {#if image}
  <span class="btn-vis-w" aria-hidden="true"><img src="/assets/images/{{image}}-320.webp" alt="" loading="lazy" decoding="async"></span>
  {/if}
  {#if icon}
  <span class="btn-vis-w" aria-hidden="true"><span>{{icon}}</span><span>{{icon}}</span></span>
  {/if}
  <span class="btn-txt-w" aria-hidden="true">
    <span>{{label}}</span>
    <span>{{label}}</span>
  </span>
</a>

<style>
  .btn {
    --e-btn-sur: var(--c-fg-90);
    --e-btn-ink: var(--c-bg);
    --e-btn-bor: transparent;
    --e-btn-vis-sur: color-mix(in srgb, var(--e-btn-ink) 15%, var(--e-btn-sur));
    --e-btn-vis-ink: color-mix(in srgb, var(--e-btn-ink) 80%, var(--e-btn-sur));
    --e-btn-vis-h: 2.5lh;
    border: var(--s-bw) var(--e-btn-bor) solid;
    background: var(--e-btn-sur);
    color: var(--e-btn-ink);
    display: inline-flex;
    cursor: pointer;
    padding: var(--s-pd-sm) var(--s-pd);
    text-decoration: none;
    border-radius: var(--s-br);


    &.ghost {
      --e-btn-sur: transparent;
      --e-btn-ink: var(--c-mut);
      --e-btn-bor: transparent;
    }

    &.tone {
      --e-btn-sur: var(--c-sur);
      --e-btn-ink: var(--c-neu-80);
      --e-btn-bor: var(--c-bor);
    }

    &.accent {
      --e-btn-sur: var(--c-acc);
      --e-btn-ink: var(--c-acc-ink);

      &.tone {
        --e-btn-sur: var(--c-acc-05);
        --e-btn-ink: var(--c-acc-60);
        --e-btn-bor: var(--c-acc-10);
      }
    }

    &.secondary {
      --e-btn-sur: var(--c-sec);
      --e-btn-ink: var(--c-sec-ink);

      &.tone {
        --e-btn-sur: var(--c-sec-05);
        --e-btn-ink: var(--c-sec-60);
        --e-btn-bor: var(--c-sec-10);
      }
    }

    &:is(:hover, :focus-visible) {
      --e-btn-sur: var(--c-neu-100);
      --e-btn-ink: var(--c-neu-00);


      &.ghost {
        --e-btn-sur: var(--c-sur);
        --e-btn-ink: var(--c-ink);
        --e-btn-bor: transparent;
      }

      &.tone {
        --e-btn-sur: var(--c-acc-05);
        --e-btn-ink: var(--c-acc-80);
        --e-btn-bor: var(--c-acc-10);
      }

      &.accent,
      &.secondary {
        --e-btn-sur: var(--c-ink);
        --e-btn-ink: var(--c-bg);

        &.tone {
          --e-btn-sur: var(--c-sur);
          --e-btn-ink: var(--c-neu-80);
          --e-btn-bor: var(--c-bor);
        }
      }
    }

    &:active {
      filter: brightness(0.9) contrast(1.5);
    }

    &.sm {
      --e-btn-vis-h: 2.5em;
      padding: var(--s-pd-xs) var(--s-pd-sm);
      border-radius: var(--s-br-sm);
      font-size: var(--t-sm-fs);

      &:has(.btn-vis-w) {
        padding: var(--e-btn-pd) var(--s-pd-sm) var(--e-btn-pd) var(--e-btn-pd);
      }
    }

    &.lg {
      --e-btn-vis-h: 4em;
      padding: var(--s-pd) var(--s-pd-lg);
      border-radius: var(--s-br-lg);
      font-size: var(--t-lg-fs);

      &:has(.btn-vis-w) {
        padding: var(--e-btn-pd) var(--s-pd-lg) var(--e-btn-pd) var(--e-btn-pd);
      }
    }

    /* with visual content */
    &:has(.btn-vis-w) {
      --e-btn-pd: .2em;
      align-items: center;
      gap: var(--s-gp);
      padding: var(--e-btn-pd) var(--s-pd) var(--e-btn-pd) var(--e-btn-pd);
      transition-property: background, color, border-color;
      transition-duration: var(--m-td-f);
      transition-timing-function: var(--m-tf-o);
    }

    .btn-vis-w,
    .btn-txt-w {
      overflow: hidden;
    }

    .btn-vis-w {
      flex: none;
      border-radius: calc(var(--s-br) - var(--e-btn-pd));

      &:has(:is(span, i, b, svg)) {
        display: inline-flex;
        width: var(--e-btn-vis-h);
        height: var(--e-btn-vis-h);
        align-items: center;
        justify-content: flex-end;
        background: var(--e-btn-vis-sur);
        color: var(--e-btn-vis-ink);
        transition-property: background, color;
        transition-duration: var(--m-td);
        transition-timing-function: var(--m-tf-o);
      }

      &:has(:is(img, picture)) {
        height: var(--e-btn-vis-h);
      }

      :is(span, i, b, svg) {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 100%;
        height: 100%;
        transform: translateX(calc(100% * var(--i-hov-t)));
        transition-property: transform, color;
        transition-duration: var(--m-td-s);
        transition-timing-function: var(--m-tf-s);
      }

      :is(img, picture) {
        display: block;
        height: 100%;
        width: auto;
        transform: scale(calc(1 + .2 * var(--i-hov-f)));
        transition-property: transform;
        transition-duration: var(--m-td-f);
        transition-timing-function: var(--m-tf-o);
      }

      img {
        height: 100%;
        width: auto;
        object-fit: cover;
      }
    }

    .btn-txt-w {
      height: 1lh;

      span {
        display: block;
        transform: translateY(calc(var(--i-hov-t) * -100%));
        transition-property: transform, color;
        transition-duration: var(--m-td-s);
        transition-timing-function: var(--m-tf-s);
      }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn {
      .btn-vis-w :is(span, i, b, svg),
      .btn-vis-w :is(img, picture),
      .btn-txt-w span {
        transform: none;
        transition: none;
      }
    }
  }
</style>
