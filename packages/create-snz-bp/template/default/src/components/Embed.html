<!--
  @desc Responsive external embed wrapper for iframes and rich media.
  @attr src! Embed URL.
  @attr title! Accessible title for the embedded content.
  @attr ratio=[16/9|4/3|1/1|auto] :class Aspect ratio. Defaults to 16/9.
-->
<div class="embed {{ratio}}">
  <iframe src="{{src}}" title="{{title}}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<style>
  .embed {
    --emb-r: 16 / 9;
    background: var(--t);
    border: var(--bw) solid var(--b);
    border-radius: var(--br);
    overflow: hidden;
    aspect-ratio: var(--emb-r);
    width: 100%;

    &.\34\/3 { --emb-r: 4 / 3; }
    &.\31\/1 { --emb-r: 1 / 1; }
    &.auto { aspect-ratio: auto; }

    iframe {
      display: block;
      border: 0;
      width: 100%;
      height: 100%;
      min-height: 16rem;
    }
  }
</style>
