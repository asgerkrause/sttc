<!--
  @desc Native submit button using the shared button visual style.
  @attr label Visible button text. Defaults to Submit.
  @attr color=[default|ghost|tone|accent|accent tone|secondary|secondary tone] :class Visual color treatment.
  @attr size=[sm|md|lg] :class Size variant.
  @attr disabled Disables the submit button.
-->
<button class="btn" type="submit" aria-label="{{label}}" {#if disabled}disabled{/if}>
  <span class="btn-txt-w" aria-hidden="true">
    <span>{{label}}</span>
    <span>{{label}}</span>
  </span>
</button>
