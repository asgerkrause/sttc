<!--
  @desc Native scroll-snap gallery with previous/next controls.
  @attr label! Accessible slider label.
  @attr cols Column count as large-medium split value. Defaults to 4 large / 2 medium.
-->
<div class="slider" aria-label="{{label}}">
  <div data-slider="track" data-cols="{{cols}}">
    {{slot}}
  </div>
  <div data-slider="controls" aria-label="Slider controls">
    <button type="button" data-slider="prev" aria-label="Previous items">Prev</button>
    <button type="button" data-slider="next" aria-label="Next items">Next</button>
  </div>
</div>

<script>
  const track = el.querySelector('[data-slider="track"]')
  const prev = el.querySelector('[data-slider="prev"]')
  const next = el.querySelector('[data-slider="next"]')
  if (!track) return

  const items = [...track.children]
  const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'

  function gap() {
    return Number.parseFloat(getComputedStyle(track).gap) || 0
  }

  function amount() {
    return (track.firstElementChild?.getBoundingClientRect().width || track.clientWidth) + gap()
  }

  function updateEdges(entries) {
    for (const entry of entries) {
      if (entry.target === items[0]) prev?.toggleAttribute('disabled', entry.isIntersecting)
      if (entry.target === items[items.length - 1]) next?.toggleAttribute('disabled', entry.isIntersecting)
    }
  }

  const observer = new IntersectionObserver(updateEdges, { root: track, threshold: 0.6 })
  for (const item of items) observer.observe(item)

  const scrollBy = (direction) => () => track.scrollBy({ left: direction * amount(), behavior })
  const onPrev = scrollBy(-1)
  const onNext = scrollBy(1)

  prev?.addEventListener('click', onPrev)
  next?.addEventListener('click', onNext)

  if (items.length < 2) {
    prev?.setAttribute('disabled', '')
    next?.setAttribute('disabled', '')
  }

  return () => {
    observer.disconnect()
    prev?.removeEventListener('click', onPrev)
    next?.removeEventListener('click', onNext)
  }
</script>

<style>
  .slider {
    display: grid;
    gap: var(--pd);
  }

  .slider [data-slider="track"] {
    --gc: 4;
    display: flex;
    align-items: start;
    gap: var(--gp);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    border-radius: var(--br);
    -webkit-overflow-scrolling: touch;
  }

  .slider [data-slider="track"]::-webkit-scrollbar {
    display: none;
  }

  .slider [data-slider="track"] > * {
    flex: 0 0 calc(((100% + var(--gp)) / var(--gc)) - var(--gp));
    min-width: 0;
    scroll-snap-align: start;
    overflow: hidden;
    border-radius: var(--br);
    user-select: none;
    -webkit-user-drag: none;
  }

  .slider [data-slider="track"] img {
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .slider [data-slider="controls"] {
    display: flex;
    justify-content: end;
    gap: var(--gp);
  }

  .slider button {
    all: unset;
    color: var(--g);
    cursor: pointer;
    text-decoration: none;
    transition: opacity var(--td) var(--tf-o), color var(--td) var(--tf-o);
  }

  .slider button[disabled] {
    opacity: .35;
    pointer-events: none;
  }

  .slider button:focus-visible {
    outline: var(--bw) solid currentColor;
    outline-offset: calc(var(--bw) * 2);
  }

  .slider [data-cols$="1"] { --gc: 1; }
  .slider [data-cols$="2"] { --gc: 2; }
  .slider [data-cols$="3"] { --gc: 3; }
  .slider [data-cols$="4"] { --gc: 4; }
  .slider [data-cols$="5"] { --gc: 5; }
  .slider [data-cols$="6"] { --gc: 6; }

  @media (width < 30rem) {
    .slider [data-slider="track"] {
      --gc: 1;
    }
  }

  @media (width >= 60rem) {
    .slider [data-cols^="1"] { --gc: 1; }
    .slider [data-cols^="2"] { --gc: 2; }
    .slider [data-cols^="3"] { --gc: 3; }
    .slider [data-cols^="4"] { --gc: 4; }
    .slider [data-cols^="5"] { --gc: 5; }
    .slider [data-cols^="6"] { --gc: 6; }
  }

  @media (hover: hover) {
    .slider button:hover {
      color: var(--i);
      text-decoration: underline;
    }
  }
</style>
