<!--
  @desc Tab panel for use inside Tabs. Match id with a Tab id.
  @attr id! Stable panel id shared with the matching Tab.
-->
<div role="tabpanel" id="panel-{{id}}" aria-labelledby="tab-{{id}}">
  {{slot}}
</div>

<style>
  [role="tabpanel"] {
    border: var(--s-bw) solid var(--c-bor);
    border-radius: var(--s-br);
    padding: var(--s-pd);
    background: var(--c-sur);
  }

  [role="tabpanel"][hidden] {
    display: none;
  }
</style>
