<!--
  @desc Accessible tab set. Put <Tab> and matching <TabPanel> items in the default slot.
  @attr label Accessible label for the tab list. Defaults to Tabs.
  @attr orientation=[horizontal|vertical] :class Tab layout orientation.
-->
<div class="tabs" data-orientation="{{orientation}}" data-label="{{label}}">
  {{slot}}
</div>

<script>
const tabs = () => [...el.querySelectorAll('[role="tab"]')]
const panels = () => [...el.querySelectorAll('[role="tabpanel"]')]
let list = el.querySelector('[role="tablist"]')
let panelGroup = el.querySelector('[data-tabs="panels"]')

if (!list) {
  list = document.createElement('div')
  list.setAttribute('role', 'tablist')
  list.setAttribute('aria-label', el.dataset.label || 'Tabs')
  el.prepend(list)
}

if (!panelGroup) {
  panelGroup = document.createElement('div')
  panelGroup.setAttribute('data-tabs', 'panels')
  list.after(panelGroup)
}

for (const tab of tabs()) list.append(tab)
for (const panel of panels()) panelGroup.append(panel)

function setActive(tab, focus = false) {
  if (!tab) return
  for (const item of tabs()) {
    const active = item === tab
    item.setAttribute('aria-selected', active ? 'true' : 'false')
    item.tabIndex = active ? 0 : -1
  }
  for (const panel of panels()) {
    const active = panel.id === tab.getAttribute('aria-controls')
    panel.hidden = !active
    panel.toggleAttribute('data-active', active)
  }
  if (focus) tab.focus()
}

function move(from, dir) {
  const items = tabs()
  const index = items.indexOf(from)
  if (index < 0) return
  const next = dir === 'first' ? 0 : dir === 'last' ? items.length - 1 : (index + (dir === 'prev' ? -1 : 1) + items.length) % items.length
  setActive(items[next], true)
}

const onClick = (event) => {
  const tab = event.target.closest('[role="tab"]')
  if (tab && el.contains(tab)) setActive(tab)
}

const onKeydown = (event) => {
  const tab = event.target.closest('[role="tab"]')
  if (!tab || !el.contains(tab)) return
  const keys = { ArrowLeft: 'prev', ArrowUp: 'prev', ArrowRight: 'next', ArrowDown: 'next', Home: 'first', End: 'last' }
  const dir = keys[event.key]
  if (!dir) return
  event.preventDefault()
  move(tab, dir)
}

list.addEventListener('click', onClick)
list.addEventListener('keydown', onKeydown)
setActive(tabs().find((tab) => tab.getAttribute('aria-selected') === 'true') ?? tabs()[0])

return () => {
  list.removeEventListener('click', onClick)
  list.removeEventListener('keydown', onKeydown)
}
</script>

<style>
  .tabs {
    display: grid;
    grid-template-columns: minmax(10rem, 0.8fr) minmax(0, 2fr);
    gap: var(--gp);
    align-items: start;
  }

  .tabs > [role="tablist"] {
    display: flex;
    flex-direction: column;
    gap: var(--pd-xs);
  }

  .tabs.horizontal {
    grid-template-columns: 1fr;
  }

  .tabs.horizontal > [role="tablist"] {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .tabs > [data-tabs="panels"] {
    min-width: 0;
  }

  .tabs > [role="tabpanel"] {
    display: none;
  }

  .tabs > [role="tabpanel"]:first-of-type,
  .tabs [role="tabpanel"][data-active] {
    display: block;
  }

  .tabs [role="tabpanel"][hidden] {
    display: none;
  }

  @media (width < 48rem) {
    .tabs {
      grid-template-columns: 1fr;
    }

    .tabs > [role="tablist"] {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: var(--pd-xs);
    }
  }
</style>
