<!--
  @desc Product listing wrapper. Use Product cards in the slot, or source="polar" to render Polar products at build time.
  @attr source=[manual|polar] Product data source. Defaults to manual.
  @attr cols Grid column split. Defaults to 3-2.
  @attr empty Empty-state text. Defaults to No products available.
-->
<div class="products">
  <Grid cols="{{cols}}">
    {{slot}}
    {#each products as product}
    <Product name="{{product.name}}" description="{{product.description}}" price="{{product.price}}" interval="{{product.interval}}" href="{{product.href}}" cta="{{product.cta}}" />
    {/each}
  </Grid>
</div>

<style>
  .products { width: 100%; }
</style>
