<!--
  @desc Continuous slot-first marquee with scroll-reactive direction/speed and reduced-motion fallback.
  @attr label Accessible label for marquee content.
  @attr speed Seconds per loop. Defaults to 25.
  @attr scroll Scroll velocity multiplier. Defaults to 2.
  @attr fade=[true|false] Adds edge fade mask.
  @attr pause=[hover|none] Pause behavior.
-->
<div class="marquee" data-speed="{{speed}}" data-scroll="{{scroll}}" data-fade="{{fade}}" data-pause="{{pause}}" aria-label="{{label}}">
  <div data-marquee="track">
    <div data-marquee="rail">{{slot}}</div>
  </div>
</div>

<script>
  const track = el.querySelector('[data-marquee="track"]')
  const rail = el.querySelector('[data-marquee="rail"]')
  if (!track || !rail) return

  const speed = Math.max(Number.parseFloat(el.dataset.speed) || 25, 1)
  const scroll = Number.parseFloat(el.dataset.scroll) || 2
  const ease = 0.12
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
  let resizeObserver
  let frame
  let offActive
  let railWidth = 0
  let x = 0
  let lastTime = performance.now()
  let lastScrollY = scrollY
  let direction = 1
  let targetScale = 1
  let scale = 1
  let paused = false

  function measure() {
    track.querySelectorAll('[data-marquee="clone"]').forEach((clone) => clone.remove())
    railWidth = rail.scrollWidth
    const trackWidth = track.clientWidth
    if (!railWidth || !trackWidth) return

    const copies = Math.max(Math.ceil((trackWidth + railWidth) / railWidth), 1)
    for (let index = 0; index < copies; index += 1) {
      const clone = rail.cloneNode(true)
      clone.setAttribute('data-marquee', 'clone')
      clone.setAttribute('aria-hidden', 'true')
      track.appendChild(clone)
    }
  }

  function setVelocity(delta) {
    if (!delta) return
    direction = delta < 0 ? -1 : 1
    targetScale = scroll * delta
  }

  function onScroll(event) {
    const velocity = event?.velocity
    if (typeof velocity === 'number') {
      setVelocity(velocity)
      return
    }

    const delta = scrollY - lastScrollY
    lastScrollY = scrollY
    setVelocity(delta)
  }

  function stop() {
    if (!frame) return
    cancelAnimationFrame(frame)
    frame = undefined
  }

  function tick(time) {
    const delta = time - lastTime
    lastTime = time

    targetScale += (direction - targetScale) * 0.12
    scale += (targetScale - scale) * ease

    if (!paused && railWidth) {
      const pxPerMs = railWidth / (speed * 1000)
      x = (x + pxPerMs * delta * scale) % railWidth
      if (x < 0) x += railWidth
      track.style.transform = `translate3d(${-x}px, 0, 0)`
    }

    frame = requestAnimationFrame(tick)
  }

  function start() {
    if (frame) return
    lastTime = performance.now()
    frame = requestAnimationFrame(tick)
  }

  function setPaused(value) {
    paused = value
  }

  if ('ResizeObserver' in window) {
    resizeObserver = new ResizeObserver(measure)
    resizeObserver.observe(track)
    resizeObserver.observe(rail)
  } else {
    addEventListener('resize', measure)
  }

  measure()

  if (!reduceMotion) {
    addEventListener('scroll', onScroll, { passive: true })
    window.lenis?.on?.('scroll', onScroll)
    if (el.dataset.pause === 'hover') {
      el.addEventListener('pointerenter', () => setPaused(true))
      el.addEventListener('pointerleave', () => setPaused(false))
      el.addEventListener('focusin', () => setPaused(true))
      el.addEventListener('focusout', () => setPaused(false))
    }
    offActive = window.snz?.onActive?.(el, { enter: start, exit: stop })
  }

  return () => {
    offActive?.()
    stop()
    resizeObserver?.disconnect()
    removeEventListener('resize', measure)
    removeEventListener('scroll', onScroll)
    window.lenis?.off?.('scroll', onScroll)
  }
</script>

<style>
  .marquee {
    --marquee-gap: var(--gp);
    overflow: hidden;
  }

  .marquee[data-fade="true"] {
    mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  }

  .marquee [data-marquee="track"] {
    display: flex;
    align-items: center;
    gap: var(--marquee-gap);
    width: max-content;
    min-width: 100%;
    will-change: transform;
  }

  .marquee [data-marquee="rail"],
  .marquee [data-marquee="clone"] {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    gap: var(--marquee-gap);
    min-width: max-content;
    text-wrap: nowrap;
  }

  .marquee [data-marquee="rail"] > *,
  .marquee [data-marquee="clone"] > * {
    flex: 0 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee [data-marquee="track"] {
      width: 100%;
      overflow-x: auto;
    }
  }
</style>
