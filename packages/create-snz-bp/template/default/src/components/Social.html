<!--
  @desc Text-first social/contact link. Add an <Icon> or custom SVG in the slot when needed.
  @attr href! Destination URL.
  @attr label! Accessible link label.
-->
<a class="social" href="{{href}}" aria-label="{{label}}">
  {{slot}}
</a>

<style>
  .social {
    align-items: center;
    border: var(--s-bw) solid var(--c-bor);
    border-radius: var(--s-br-pill);
    color: var(--c-mut);
    display: inline-flex;
    gap: var(--s-pd-xs);
    min-height: 2.25rem;
    padding: var(--s-pd-xs) var(--s-pd-sm);
    text-decoration: none;
  }

  @media (hover: hover) {
    .social:hover {
      border-color: var(--c-ink);
      color: var(--c-ink);
    }
  }
</style>
