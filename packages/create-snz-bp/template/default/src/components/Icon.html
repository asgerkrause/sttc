<!--
  @desc Minimal inline icon slot wrapper. Bring your own SVG/icon font until an icon library is chosen.
  @attr label Accessible label. Leave empty when decorative.
-->
{#if label}
<span class="icon" role="img" aria-label="{{label}}">{{slot}}</span>
{:else}
<span class="icon" aria-hidden="true">{{slot}}</span>
{/if}

<style>
  .icon {
    display: inline-flex;
    width: 1em;
    height: 1em;
    flex: none;
    align-items: center;
    justify-content: center;
    color: currentColor;
    line-height: 1;
  }

  .icon:empty::before {
    content: '';
    width: .45em;
    height: .45em;
    border-radius: var(--br-full);
    background: currentColor;
  }

  .icon svg {
    width: 100%;
    height: 100%;
  }
</style>
