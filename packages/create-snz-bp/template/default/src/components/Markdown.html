<!--
  @desc Inline markdown rendered at build time. Put markdown source in the default slot.
-->
<div class="md">{{rendered}}</div>

<style>
  .md {
    line-height: var(--t-md-lh);

    h2, h3, h4 { text-wrap: balance; margin-top: var(--s-ss); margin-bottom: var(--s-gp-sm); }
    p { margin: 0 0 var(--s-gp); text-wrap: pretty; }
    ul, ol { display: block; margin: 0 0 var(--s-gp); padding-left: var(--s-pd); }
    ul { list-style: disc; }
    ol { list-style: decimal; }
    li { display: list-item; }
    li + li { margin-top: var(--s-gp-xs); }
    table { width: 100%; margin: 0 0 var(--s-gp); border-collapse: collapse; font-size: var(--t-sm-fs); }
    th, td { padding: var(--s-pd-xs) var(--s-pd-sm); border-bottom: var(--s-bw) solid var(--c-bor); text-align: left; vertical-align: top; }
    th { font-weight: var(--t-fw-b); }
    code { padding: 0.125em 0.25em; font-size: var(--t-sm-fs); background: var(--c-sur); border-radius: var(--s-br-xs); }
    pre code { padding: 0; background: none; }
    a { color: inherit; text-decoration: underline; text-underline-offset: 0.2em; }
    blockquote { margin: 0 0 var(--s-gp); padding-left: var(--s-pd); border-left: calc(var(--s-bw) * 2) solid var(--c-bor); color: var(--c-mut); }
  }
</style>
