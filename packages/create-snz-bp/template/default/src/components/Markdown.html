<!--
  @desc Inline markdown rendered at build time. Put markdown source in the default slot.
-->
<div class="md">{{rendered}}</div>

<style>
  .md {
    line-height: var(--md-lh);

    h2, h3, h4 { text-wrap: balance; margin-top: var(--ss); margin-bottom: var(--gp-sm); }
    p { margin: 0 0 var(--gp); text-wrap: pretty; }
    ul, ol { display: block; margin: 0 0 var(--gp); padding-left: var(--pd); }
    ul { list-style: disc; }
    ol { list-style: decimal; }
    li { display: list-item; }
    li + li { margin-top: var(--gp-xs); }
    table { width: 100%; margin: 0 0 var(--gp); border-collapse: collapse; font-size: var(--sm-fs); }
    th, td { padding: var(--pd-xs) var(--pd-sm); border-bottom: var(--bw) solid var(--b); text-align: left; vertical-align: top; }
    th { font-weight: var(--fw-b); }
    code { padding: 0.125em 0.25em; font-size: var(--sm-fs); background: var(--t); border-radius: var(--br-xs); }
    pre code { padding: 0; background: none; }
    a { color: inherit; text-decoration: underline; text-underline-offset: 0.2em; }
    blockquote { margin: 0 0 var(--gp); padding-left: var(--pd); border-left: calc(var(--bw) * 2) solid var(--b); color: var(--g); }
  }
</style>
