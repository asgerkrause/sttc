<!--
  @desc Small inline label.
  @attr variant=[default|tone|accent|secondary] :class Visual style.
-->
<span class="badge">{{slot}}</span>

<style>
  .badge {
    align-items: center;
    align-self: start;
    background: var(--e-bdg-sur);
    border: var(--s-bw) solid var(--e-bdg-bor);
    border-radius: var(--s-br-sm);
    color: var(--e-bdg-ink);
    display: inline-flex;
    font-size: var(--t-sm-fs);
    font-weight: var(--t-fw-b);
    gap: var(--s-pd-xs);
    line-height: 1;
    padding: var(--s-pd-xs) var(--s-pd-sm);
    white-space: nowrap;
  }

  .badge.tone {
    --e-bdg-sur: var(--c-sur);
    --e-bdg-ink: var(--c-ink);
  }

  .badge.accent {
    --e-bdg-sur: var(--c-acc);
    --e-bdg-ink: var(--c-acc-ink);
    --e-bdg-bor: var(--c-acc);
  }

  .badge.secondary {
    --e-bdg-sur: var(--c-sec);
    --e-bdg-ink: var(--c-sec-ink);
    --e-bdg-bor: var(--c-sec);
  }
</style>
