<!--
  @desc Attribute grid container. cols maps to [g]; span/rows/order map to [c]/[r]/[o] when this grid is also a grid child.
  @attr cols Column count as large-medium split value. Default grid is 12 large / 6 medium.
  @attr span Column span when this grid is nested as a child.
  @attr rows Row span when this grid is nested as a child.
  @attr order Visual order as large-medium-small split value.
-->
<div g="{{cols}}" c="{{span}}" r="{{rows}}" o="{{order}}">{{slot}}</div>
