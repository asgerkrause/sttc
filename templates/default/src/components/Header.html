<!--
  @desc Semantic site header with build-time navigation data.
-->
<script type="application/json" data-snz>
{
  "items": [
    { "label": "Home", "href": "/" }
  ]
}
</script>
<header>
  <div class="c">
    <div>
      <Logo />
      <nav aria-label="Primary">
        <ul>
          {#each items as item}

          {/each}
        </ul>
      </nav>
    </div>
  </div>
</header>

<style>
  body > header {
    > .c > div {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap);
    }

    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
    }
  }
</style>
