<!--
  @desc Bun-optimized responsive image with intrinsic dimensions and native loading behavior.
  @attr src! Unique logical image name without extension.
  @attr alt! Alt text. Use alt="" for decorative images.
  @attr max Maximum encoded long edge in pixels. Defaults to 1200.
  @attr quality WebP quality from 1 to 100. Defaults to 82.
  @attr loading=[lazy|eager] Native loading mode. Defaults to lazy.
  @attr sizes Optional responsive sizes attribute.
  @attr responsive=[true|false] Set false to omit srcset. Defaults to true.
  @attr width Optional intrinsic width override.
  @attr height Optional intrinsic height override.
-->
<div class="img-w" style="aspect-ratio: {{aspectWidth}} / {{aspectHeight}}">
  {{imgMain}}
</div>

<style>
  .img-w {
    overflow: clip;
    width: 100%;

    > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  }
</style>
