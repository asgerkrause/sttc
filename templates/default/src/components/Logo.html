<!--
  @desc Text-first site identity link with optional decorative mark content.
  @attr href Destination URL. Defaults to /.
  @attr siteName Optional site-name override.
-->
<a class="logo" href="{#if href}{{href}}{:else}/{/if}">{#if slot}<span aria-hidden="true">{{slot}}</span>{/if}<span>{{siteName}}</span></a>
