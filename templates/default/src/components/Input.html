<!--
  @desc Labeled native input field.
  @attr name! Input name.
  @attr label! Visible label.
  @attr type=[text|email|tel|url|number|password|search|date|time|datetime-local] Input type. Defaults to text.
  @attr required Adds native required validation.
  @attr placeholder Placeholder text.
  @attr value Initial value.
  @attr autocomplete Browser autocomplete hint.
  @attr inputmode=[none|text|decimal|numeric|tel|search|email|url] Virtual keyboard hint.
  @attr pattern Native validation pattern.
  @attr minlength Native minimum text length.
  @attr maxlength Native maximum text length.
  @attr min Native minimum value.
  @attr max Native maximum value.
  @attr step Native number/date step.
  @attr readonly Makes the input read-only.
  @attr disabled Disables the input.
-->
<label>
  <span>{{label}}</span>
  <input type="{{type}}" name="{{name}}" {#if required}required{/if} {#if placeholder}placeholder="{{placeholder}}"{/if} {#if value}value="{{value}}"{/if} {#if autocomplete}autocomplete="{{autocomplete}}"{/if} {#if inputmode}inputmode="{{inputmode}}"{/if} {#if pattern}pattern="{{pattern}}"{/if} {#if minlength}minlength="{{minlength}}"{/if} {#if maxlength}maxlength="{{maxlength}}"{/if} {#if min}min="{{min}}"{/if} {#if max}max="{{max}}"{/if} {#if step}step="{{step}}"{/if} {#if readonly}readonly{/if} {#if disabled}disabled{/if}>
</label>
