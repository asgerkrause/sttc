<!--
  @desc Tab trigger for use inside Tabs. Match id with a TabPanel id.
  @attr id! Stable tab id shared with the matching TabPanel.
  @attr selected=[true|false] Initial selected state.
-->
<button type="button" role="tab" id="tab-{{id}}" aria-controls="panel-{{id}}" aria-selected="{{selected}}">
  {{slot}}
</button>

<style>
  .tabs [role="tab"] {
    width: 100%;
    justify-content: flex-start;
    border: var(--s-bw) solid transparent;
    border-left-color: var(--c-bor);
    background: transparent;
    color: var(--c-mut);
    cursor: pointer;
    display: inline-flex;
    gap: var(--s-pd-xs);
    padding: var(--s-pd-sm) var(--s-pd);
    text-align: left;
    border-radius: var(--s-br-sm);
  }

  .tabs [role="tab"][aria-selected="true"] {
    border-color: var(--c-bor);
    border-left-color: var(--c-acc);
    background: var(--c-sur);
    color: var(--c-ink);
  }

  .tabs [role="tab"]:focus-visible {
    outline: var(--s-bw) solid currentColor;
    outline-offset: calc(var(--s-bw) * 2);
  }

  @media (hover: hover) {
    .tabs [role="tab"]:hover {
      color: var(--c-ink);
      background: var(--c-sur);
    }
  }
</style>
