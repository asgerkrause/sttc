<head>
  <SEO title="{{title}}" description="{{description}}" path="/insights/{{basename}}/" />
  <meta name="snz:transition" content="fade">
</head>
<article class="post">
  <header>
    <h1>{{title}}</h1>
    <p class="meta">
      <time datetime="{{date}}">{{date}}</time>
    </p>
  </header>
  <div class="post-body">
    {{body}}
  </div>
  <footer>
    <Link href="/" label="← Home" />
  </footer>
</article>
